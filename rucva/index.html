<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RUCVA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --surface-2: #eef1f7;
    --border: #dde2ec;
    --text: #16233f;
    --text-muted: #5b6785;
    --navy: #0f2d5c;
    --navy-deep: #0a1f42;
    --gold: #b3891f;
    --gold-bright: #d4af37;
    --gold-soft: #f7edd2;
    --good: #1f8a5f;
    --good-soft: #e5f5ee;
    --warn: #b8860b;
    --warn-soft: #fbf1da;
    --bad: #c1392b;
    --bad-soft: #fbe9e7;
    --shadow: rgba(15, 45, 92, 0.08);
    --sidebar-w: 232px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Public Sans", system-ui, sans-serif;
    font-size: 14.5px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Sora", "Public Sans", sans-serif; margin: 0; }
  .mono { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  a { color: var(--navy); }

  #shell { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: var(--sidebar-w);
    flex: 0 0 auto;
    background: var(--navy-deep);
    color: #dde6f5;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  #logo {
    padding: 22px 20px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #logo .mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(155deg, var(--gold-bright), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-family: "Sora", sans-serif; font-weight: 800; color: var(--navy-deep); font-size: 15px;
  }
  #logo .wordmark { font-family: "Sora", sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.06em; color: var(--gold-bright); }
  #logo .sub { display: block; font-size: 10px; color: #93a4c4; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 1px; }

  nav#navlist { flex: 1; overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .navbtn {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: 8px;
    background: none; border: none; color: #c3cee6;
    text-align: left; cursor: pointer; font-size: 13.5px; font-weight: 500;
    width: 100%;
  }
  .navbtn .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.35; flex: 0 0 auto; }
  .navbtn:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .navbtn.active { background: rgba(212,175,55,0.14); color: var(--gold-bright); font-weight: 700; }
  .navbtn.active .dot { opacity: 1; background: var(--gold-bright); }

  #sidebar-foot { padding: 14px 20px 18px; font-size: 11px; color: #7e8db1; border-top: 1px solid rgba(255,255,255,0.08); }

  /* ---------- Main ---------- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 4;
  }
  #topbar h2 { font-size: 19px; color: var(--navy-deep); }
  #topbar .meta { font-size: 12px; color: var(--text-muted); }
  #mobileToggle { display: none; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }

  #content { flex: 1; padding: 24px 28px 60px; max-width: 1200px; width: 100%; }

  .panel { display: none; }
  .panel.active { display: block; animation: fade 0.15s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .panel.active { animation: none; } }

  /* ---------- Cards / grids ---------- */
  .grid { display: grid; gap: 16px; }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 900px) { .grid.cols-4, .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 620px) { .grid.cols-4, .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; box-shadow: 0 1px 2px var(--shadow);
  }
  .card.section { padding: 22px 24px; }
  .stat-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; }
  .stat-value { font-size: 26px; font-weight: 700; color: var(--navy-deep); margin-top: 6px; }
  .stat-value.gold { color: var(--gold); }
  .stat-value.good { color: var(--good); }
  .stat-value.bad { color: var(--bad); }
  .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .section-title { font-size: 16px; font-weight: 700; color: var(--navy-deep); margin-bottom: 4px; }
  .section-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 16px; }

  /* ---------- Forms ---------- */
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
  .field { margin-bottom: 14px; }
  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text); font-size: 13.5px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy); }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .checkbox-row input { width: auto; }

  button.btn {
    padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer;
    font-weight: 600; font-size: 13px;
  }
  .btn-navy { background: var(--navy); color: #fff; }
  .btn-navy:hover { background: var(--navy-deep); }
  .btn-gold { background: linear-gradient(155deg, var(--gold-bright), var(--gold)); color: #2a2000; }
  .btn-ghost { background: transparent; color: var(--navy); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--navy); }
  .btn-danger { background: var(--bad-soft); color: var(--bad); }
  .btn-sm { padding: 5px 11px; font-size: 12px; }
  button.btn:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Badges ---------- */
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .badge.buy, .badge.good, .badge.approved, .badge.low { background: var(--good-soft); color: var(--good); }
  .badge.marginal, .badge.medium, .badge.pending { background: var(--warn-soft); color: var(--warn); }
  .badge.skip, .badge.bad, .badge.rejected, .badge.high, .badge.urgent { background: var(--bad-soft); color: var(--bad); }
  .badge.neutral { background: var(--surface-2); color: var(--text-muted); }

  /* ---------- Tables ---------- */
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); padding: 8px 10px; border-bottom: 2px solid var(--border); white-space: nowrap; }
  table.data td { padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.data tbody tr:hover { background: var(--surface-2); }
  table.data input, table.data select { padding: 5px 7px; font-size: 12.5px; min-width: 70px; }
  table.data tfoot td { font-weight: 700; color: var(--navy-deep); border-top: 2px solid var(--border); border-bottom: none; }
  .table-wrap { overflow-x: auto; }
  .table-actions { display: flex; gap: 8px; margin-bottom: 12px; }

  /* ---------- Chat ---------- */
  #chatPanel .card.section { display: flex; flex-direction: column; height: calc(100vh - 190px); min-height: 420px; padding: 0; overflow: hidden; }
  #chatLog { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .chatrow { display: flex; }
  .chatrow.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; }
  .chatrow.user .bubble { background: var(--navy); color: #fff; border-bottom-right-radius: 4px; }
  .chatrow.assistant .bubble { background: var(--surface-2); color: var(--text); border-bottom-left-radius: 4px; }
  .chatrow.assistant .bubble:empty::after { content: "thinking…"; color: var(--text-muted); font-style: italic; }
  .chat-tool-chip { display: inline-block; margin: 4px 4px 0 0; font-family: "JetBrains Mono", monospace; font-size: 10px; padding: 2px 8px; background: var(--gold-soft); color: var(--gold); border-radius: 999px; }
  .chat-notice { align-self: center; font-size: 12px; color: var(--text-muted); }
  #chatInputBar { display: flex; gap: 8px; align-items: flex-end; padding: 14px 18px; border-top: 1px solid var(--border); background: var(--surface); }
  #chatInput { flex: 1; resize: none; height: 42px; max-height: 140px; }
  #micBtn, #speakToggle, #attachBtn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #micBtn.listening { background: var(--bad); border-color: var(--bad); color: #fff; }
  #speakToggle.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  #sendBtn { flex: 0 0 auto; }
  #imagePreviewRow { display: none; gap: 8px; padding: 10px 18px 0; flex-wrap: wrap; }
  .img-thumb { position: relative; width: 54px; height: 54px; }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 7px; border: 1px solid var(--border); }
  .img-thumb button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--bad); color: #fff; border: none; font-size: 11px; line-height: 1; cursor: pointer; padding: 0; }
  .chat-image-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chat-image-row img { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; }

  /* ---------- Misc ---------- */
  .flex-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .muted { color: var(--text-muted); }
  .progress { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--navy), var(--gold-bright)); }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; }
  .bars .bar { flex: 1; background: var(--surface-2); border-radius: 4px 4px 0 0; position: relative; min-height: 2px; }
  .bars .bar > span { position: absolute; inset: 0; background: linear-gradient(180deg, var(--gold-bright), var(--navy)); border-radius: 4px 4px 0 0; }
  .empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 24px 10px; }
  .banner { padding: 10px 14px; border-radius: 8px; font-size: 12.5px; margin-bottom: 14px; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.bad { background: var(--bad-soft); color: var(--bad); }
  .banner.good { background: var(--good-soft); color: var(--good); }
  .icon-x { background: none; border: none; color: var(--bad); cursor: pointer; font-size: 15px; padding: 2px 6px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  @media (max-width: 860px) {
    #sidebar { position: fixed; left: -260px; z-index: 20; transition: left 0.2s ease; box-shadow: 4px 0 24px rgba(0,0,0,0.2); }
    #sidebar.open { left: 0; }
    #mobileToggle { display: inline-flex; }
    #content { padding: 18px 16px 50px; }
    #topbar { padding: 14px 16px; }
  }
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div id="logo">
      <div class="mark">R</div>
      <div>
        <div class="wordmark">RUCVA</div>
        <span class="sub">FBA Virtual Assistant</span>
      </div>
    </div>
    <nav id="navlist"></nav>
    <div id="sidebar-foot">Private workspace — data stays in this browser and your own Google account.</div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div class="flex-between" style="gap:14px;">
        <button id="mobileToggle" aria-label="Menu">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
      </div>
      <div class="meta mono" id="topbarMeta"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
