<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FBA Ops Manager</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #e8a33d;
    --user-bubble: #2a2f3a;
    --agent-bubble: #1d2230;
    --tool-chip: #3a2f1d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 820px; margin: 0 auto; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.2px; }
  header .status { font-size: 12px; color: var(--muted); }
  header button { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  header button:hover { color: var(--text); border-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; line-height: 1.45; white-space: pre-wrap; font-size: 14px; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.agent { align-self: flex-start; background: var(--agent-bubble); border: 1px solid var(--border); }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; font-style: italic; }
  .tools { align-self: flex-start; display: flex; gap: 6px; flex-wrap: wrap; margin-top: -6px; }
  .tools span { background: var(--tool-chip); color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  #composer { display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid var(--border); }
  #composer textarea { flex: 1; resize: none; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; height: 44px; }
  #composer button { background: var(--accent); color: #1a1300; border: none; border-radius: 8px; padding: 0 18px; font-weight: 600; cursor: pointer; }
  #composer button:disabled { opacity: 0.5; cursor: default; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>FBA Operations Manager</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="status" id="status">checking backend…</span>
      <button id="resetBtn">Reset chat</button>
    </div>
  </header>
  <div id="log"></div>
  <form id="composer">
    <textarea id="input" placeholder="Ask about margins, reorder timing, PPC, a POA, or a sourcing idea… (Shift+Enter for newline)"></textarea>
    <button id="sendBtn" type="submit">Send</button>
  </form>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const resetBtn = document.getElementById('resetBtn');
const SESSION_ID = 'web-' + Math.random().toString(36).slice(2);

function addMessage(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function addToolChips(names) {
  if (!names || !names.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'tools';
  wrap.innerHTML = names.map(n => `<span>${n}</span>`).join('');
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

async function checkHealth() {
  try {
    const r = await fetch('/health');
    if (r.ok) { statusEl.textContent = 'backend online'; return; }
  } catch (e) {}
  statusEl.textContent = 'backend unreachable';
}

async function send(message) {
  addMessage('user', message);
  sendBtn.disabled = true;
  const pending = addMessage('agent', 'thinking…');
  pending.classList.add('muted');
  try {
    const r = await fetch('/agent/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: SESSION_ID }),
    });
    const data = await r.json();
    pending.remove();
    if (!r.ok) {
      addMessage('system', 'Error: ' + (data.detail || r.status));
      return;
    }
    addMessage('agent', data.reply || '(no reply)');
    addToolChips(data.tools_used);
  } catch (e) {
    pending.remove();
    addMessage('system', 'Request failed: ' + e.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

resetBtn.addEventListener('click', async () => {
  await fetch('/agent/reset?session_id=' + SESSION_ID, { method: 'POST' });
  log.innerHTML = '';
  addMessage('system', 'Chat reset.');
});

checkHealth();
addMessage('system', 'Connected. Ask about a product idea, your numbers, PPC, inventory, or a policy notice.');
</script>
</body>
</html>
